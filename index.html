<!DOCTYPE html>
<html>
<head>
  <title>Turnis | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="auth-wrapper">
  <div class="auth-card">
    <h4 class="text-center mb-3">Turnis</h4>

    <select id="role" class="form-select mb-2">
      <option value="user">User</option>
      <option value="admin">Admin</option>
    </select>

    <input id="username" class="form-control mb-2" placeholder="Username">
    <input id="password" type="password" class="form-control mb-3" placeholder="Password">

    <button class="btn btn-main w-100 mb-2" onclick="login()">Login</button>
    <button class="btn btn-outline-secondary w-100" onclick="signup()">Signup</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
