<!DOCTYPE html>
<html>
<head>
  <title>Turnis | Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<nav class="navbar bg-white shadow-sm px-4">
  <strong>Turnis</strong>
  <div class="nav-pill">
    <button id="bookBtn" class="btn btn-light" onclick="showPage('book')">Book</button>
    <button id="liveBtn" class="btn btn-light" onclick="showPage('live')">Live Queue</button>
    <button id="adminBtn" class="btn btn-light" onclick="showPage('admin')">Admin</button>
    <button class="btn btn-danger btn-sm" onclick="logout()">Logout</button>
  </div>
</nav>

<!-- BOOK -->
<div id="book" class="container my-5 hidden">
  <div class="card-box">
    <h4>Get Token</h4>

    <input id="nameInput" class="form-control my-2" placeholder="Your Name">

    <select id="purposeInput" class="form-select my-2">
      <option>General</option>
      <option>Consultation</option>
      <option>Billing</option>
      <option>Emergency</option>
    </select>

    <button class="btn btn-main w-100 mt-2" onclick="getToken()">Get Token</button>
    <div id="tokenInfo" class="fw-bold text-center mt-3"></div>
  </div>
</div>

<!-- ADMIN -->
<div id="admin" class="container my-5 hidden">
  <div class="row text-center mb-4">
    <div class="col"><div class="stat-card"><span id="waitingCount">0</span><br>Waiting</div></div>
    <div class="col"><div class="stat-card"><span id="servingCount">0</span><br>Serving</div></div>
    <div class="col"><div class="stat-card"><span id="completedCount">0</span><br>Completed</div></div>
  </div>

  <button class="btn btn-main w-100 mb-3" onclick="serveNext()">▶ Serve Next</button>
  <div id="queueList" class="card-box text-muted text-center"></div>
</div>

<!-- LIVE QUEUE (USER) -->
<div id="live" class="container my-5 hidden">
  <div class="now-serving">
    <h6>NOW SERVING</h6>
    <h2 id="nowServing">—</h2>
    <p>Your waiting time: <strong id="waitTime">—</strong></p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
